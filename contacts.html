
<html lang="en">
<head>
    <title>Contact Us</title>
    <style>
        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 30px;
        }
        h1{
            color:rgb(105, 46, 1)
        }
        form{
            padding-left: 100px;
        }
        form input{
            border-radius: 15px;
            font-size: 24px;
            border: 1px solid black;
            padding: 5px;

        }
        form button{
            background-color: chocolate;
            font-size: 28px;
            border-radius: 5px;
            border: none;
            padding: 10px;
        }
        p{
            font-size: 20px;
        }
    </style>
</head>
<body>

    <center><h1>Contact Us</h1></center>
    <center><p>We would love to hear from you. Please fill out the form below.</p></center>

    <form action="#" method="post">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        <br><br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Enter subject" required>
        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="30"
            placeholder="Write your message here..." required></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <h3>Our Contact Information</h3>
    <p>Email: abesec@abes.ac.in</p>
    <p>Phone: +91 658465xxx5</p>
    <p>Address: Ghaziabad, India</p>

</body>
</html>
